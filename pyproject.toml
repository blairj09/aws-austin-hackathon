[project]
name = "caregivers"
version = "0.1.0"
description = "Track 1 (Caregivers Challenge) starter for the AWS Austin Agentic AI Hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatlas>=0.23",
    "boto3>=1.35",
    "anthropic[bedrock]",
    "openai",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "shiny>=1.2",
    "shinychat>=0.2",
]

[project.optional-dependencies]
agentcore = ["bedrock-agentcore", "bedrock-agentcore-starter-toolkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caregivers"]
